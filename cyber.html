<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Portfolio</title>
    <style>
        :root {
            --neon-blue: rgb(0, 195, 255);
            --neon-pink: rgb(255, 0, 170);
            --bg-dark: #151718;
            --card-bg: rgba(32, 34, 37, 0.95);
            --glow-spread: 15px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            perspective: 1000px;
            padding: 2rem;
        }

        .container {
            width: 1200px;
            height: 800px;
            background: var(--card-bg);
            border-radius: 30px;
            padding: 2rem;
            position: relative;
            transform: rotateX(20deg);
            box-shadow: 
                0 0 var(--glow-spread) var(--neon-blue),
                0 0 var(--glow-spread) var(--neon-pink),
                inset 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 30px;
            background: linear-gradient(45deg, 
                var(--neon-pink) 0%, 
                transparent 20%,
                transparent 80%,
                var(--neon-blue) 100%
            );
            opacity: 0.1;
            pointer-events: none;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .nav-icons {
            display: flex;
            gap: 1rem;
        }

        .icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--card-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .icon:hover {
            box-shadow: 
                0 0 var(--glow-spread) var(--neon-blue),
                0 0 var(--glow-spread) var(--neon-pink);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 2rem;
            height: calc(100% - 80px);
        }

        .profile-section {
            position: relative;
        }

        .profile-circle {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: var(--card-bg);
            position: relative;
            margin: 2rem auto;
            overflow: hidden;
        }

        .profile-circle::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-blue));
            border-radius: 50%;
            z-index: -1;
            animation: rotate 10s linear infinite;
        }

        .profile-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-blue));
        }

        .glow-button {
            background: var(--card-bg);
            border: none;
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 30px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .glow-button::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-blue));
            border-radius: 30px;
            z-index: -1;
        }

        .glow-button:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 0 var(--glow-spread) var(--neon-blue),
                0 0 var(--glow-spread) var(--neon-pink);
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .status-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid var(--neon-blue);
            position: relative;
            margin: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 
                0 0 var(--glow-spread) var(--neon-blue),
                0 0 var(--glow-spread) var(--neon-pink);
        }

        .text-glow {
            text-shadow: 
                0 0 10px var(--neon-blue),
                0 0 20px var(--neon-pink);
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="nav">
            <div class="nav-icons">
                <div class="icon"></div>
                <div class="icon"></div>
                <div class="icon"></div>
            </div>
            <div class="nav-icons">
                <div class="icon"></div>
                <div class="icon"></div>
            </div>
        </nav>

        <div class="main-content">
            <div class="side-content">
                <div class="card">
                    <h3 class="text-glow">Profile Picture</h3>
                    <p>Double Mixture</p>
                </div>
                <div class="status-circle">222</div>
            </div>

            <div class="profile-section">
                <div class="profile-circle">
                    <img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/DALL%C2%B7E%202025-02-13%2010.27.48%20-%20A%20futuristic%20cyber-tech%20themed%20portfolio%20website%20design%20concept.%20The%20design%20features%20a%20sleek%20dark%20background%20with%20neon%20blue%20and%20pink%20glow%20effects%20arou-LsI585KSnLwtikLJCFTpMZPVQ8jMUv.webp" alt="Profile" class="profile-image">
                </div>
            </div>

            <div class="side-content">
                <div class="card">
                    <h3 class="text-glow">Portfolio</h3>
                    <p>Color Settings</p>
                    <button class="glow-button">View More</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Add hover effects
        document.querySelectorAll('.icon').forEach(icon => {
            icon.addEventListener('mouseover', () => {
                icon.style.transform = 'scale(1.1)';
            });
            icon.addEventListener('mouseout', () => {
                icon.style.transform = 'scale(1)';
            });
        });
    </script>
</body>
</html>
